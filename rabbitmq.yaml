- name: config rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
    - name:
      ansible.builtin.copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.respo

    - name: install rabbitmq
      ansible.builtin.dnf:
        name: rabbitmq-server
        state: present

    - name: start and enable rabbitmq
      ansible.builtin.service:
        name: rabitmq
        state: restarted
        enabled: yes

    - name: add user and permission
      community.rabbitmq.rabbitmq_user:
        user: roboshop 
        password: roboshop123
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        state: present