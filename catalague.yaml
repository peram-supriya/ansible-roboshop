- name: catalague
  hosts: all
  become: yes
  tasks: 
  - name: install catalague
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs 
      state: present

  - name: create a user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: Create a basic directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: ansible download file
    ansible.builtin.get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip"
      dest: "/tmp/catalogue.zip"
      
  - name: ansible unzip the file
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app