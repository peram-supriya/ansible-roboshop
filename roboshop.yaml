- name: launch instance
  hosts: all
  connection: local
  vars:
    SD_ID: "sg-0f7364ef02abff9ad"
    AMI_ID: "ami-0220d79f3f480ecf5"
    env: Dev
    instance:
      -mongodb
      -catalogue
  tasks:
  - name: create instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      image_id: "{{ AMI_ID }}"
      security_group: "{{ SD_ID }}"
      name: "{{ item }} - {{ env}}"

      tags:
        project: roboshop
        component: "{{ item }}"
        environment: "{{ env }}"
        name: "{{ item }} - {{ env }}" 

    loop: "{{ instance }}"
    register: user_output

  - name: print out out
    ansible.builtin.debug:
      msg: "{{ user_output }}"
  
    