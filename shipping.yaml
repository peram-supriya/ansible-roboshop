- name: config shipping
  hosts: shipping
  become: yes

  tasks:
  - name: install namven
    ansible.builtin.dnf:
      name: "{{ item }}" 
      state: presnt
    loop:
      - maven
      - mysql
  
  - name: create a shipping
    ansible.builtin.shipping:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system shipping"

  - name: delete the folder
    ansible.builtin.file:
      path: /app
      state: absent

  - name: Create a basic directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: delete shipping zip file
    ansible.builtin.file:
      path: /tmp/shipping.zip
      state: absent

  - name: ansible download file
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
      
  - name: ansible unzip the file
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: install dependances
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: install dependances
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: copy the service file
    ansible.builtin.template:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service


  - name: demon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: import shipping data
    community.mysql.mysql_db:
      state: import
      name: all
      login_host: "{{ MYSQL_HOST }}"
      login_user: root
      login_password: RoboShop@1
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql

  - name: start  and enable shipping
    ansible.builtin.service:
      name: shipping
      state: restarted
      enabled: yes